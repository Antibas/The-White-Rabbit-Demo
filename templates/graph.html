<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Output Graph</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}"> -->
        <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
        <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
        <link href="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="static/css/styles.css">
        <link rel="shortcut icon" href="static/images/favicon.ico">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <input type="hidden" id="algorithm_body" value="{{body}}">
        <header class="header">
            <div class="container-xxl text-center">
                <h1 class="h1">Algorithm {{ body['algorithm'] }}</h1>
                <div class="bg-white rounded-pill my-4">
                    <h3 class="h3 visually-hidden" id="embedding"></h3>
                    <h3 class="h3" id="dataset"></h3>
                    <h3 class="h3" id="accuracy"></h3>
                    <h3 class="h3" id="timeout"></h3>
                </div>
            </div>
        </header>
        <div class="container card py-3 px-3">
            <div class="card-header shadow-lg text-center">
                <h2 class="h2">Output for {{ body['source'] }} &rarr; {{ body['target'] }}</h2>
                <p class="sm" id="wait">Please wait...</p>
            </div>
            
            <div class="card-body text-center">
                <div class="block justify-content-center" id="loader">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <div class="d-flex justify-content-center">
                        <ul class="d-flex list-group list-group-horizontal-lg mt-2 w-100 shadow-sm" id="current_node_similarity">
                            <li class="list-group-item flex-fill text-center">
                                <h3 class="h3" id="current_node">

                                </h3>
                            </li>
                            <li class="list-group-item text-center">
                                <h3 class="h3" id="similarity">

                                </h3>
                            </li>
                        </ul>
                    </div>
                </div>
                <h3 class="h3 alert alert-danger visually-hidden" role="alert" id="error">
                </h3>
                <div class="visually-hidden" id="results">
                    <div class="d-flex justify-content-center">
                        <ul class="list-group list-group-horizontal shadow-sm">
                            <li class="list-group-item" id="time"></li>
                            <li class="list-group-item" id="length"></li>
                            <li class="list-group-item" id="pc"></li>
                            <li class="list-group-item" id="ta"></li>
                        </ul>
                    </div>
                    <div class="d-flex justify-content-center mt-4">
                        <!-- <h3 class="h3">Path:</h3> -->
                        <div id="graph" class="shadow-lg"></div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer text-center mt-2">
            <p class="text-muted">&copy; 2025. All rights reserved.</p>
        </footer>
        <script src="static/js/script.js"></script>
        <script src="static/js/graph.js"></script>
        <!-- <script src="{{ url_for('static', filename='js/script.js') }}"></script> -->
         <!-- <script src="{{ url_for('static', filename='js/graph.js') }}"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>

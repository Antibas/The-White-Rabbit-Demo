<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Output Graph</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}"> -->
        <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
        <link rel="stylesheet" href="static/css/styles.css">
        <link rel="shortcut icon" href="static/images/favicon.ico">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <input type="hidden" id="algorithm_body" value="{{body}}">
        <header class="header">
            <div class="container-xxl text-center">
                <h1 class="h1">Output for {{ body['source'] }}-{{ body['target'] }}</h1>
            </div>
        </header>
        <div class="card">

        </div>
        <footer class="footer text-center">
            <p class="text-muted">&copy; 2025. All rights reserved</p>
        </footer>
        <script>
            const socket = io();

            socket.on('connect', () => {
                console.log('Connected to WebSocket');
            });

            socket.on('response', function(data) {
                console.log(data)
            });

            document.addEventListener("DOMContentLoaded", (ev) => {
                let algorithm_body = document.getElementById("algorithm_body").value;
                algorithm_body = algorithm_body.replace("ImmutableMultiDict", "")
                    .replaceAll("(", "[")
                    .replaceAll(")", "]")
                    .replaceAll("'", "\"");
                // console.log(JSON.parse(algorithm_body))
                socket.send(algorithm_body.substring(1, algorithm_body.length-1));
            })

        </script>
        <script src="static/js/script.js"></script>
        <!-- <script src="{{ url_for('static', filename='js/script.js') }}"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>

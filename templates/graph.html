<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Output Graph</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}"> -->
        <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
        <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
        <link href="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="static/css/styles.css">
        <link rel="shortcut icon" href="static/images/favicon.ico">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <input type="hidden" id="algorithm_body" value="{{body}}">
        <header class="header">
            <div class="container-xxl text-center">
                <h1 class="h1">Algorithm {{ body['algorithm'] }}</h1>
                <h3 class="h3" id="accuracy"></h3>
                <h3 class="h3" id="timeout"></h3>
            </div>
        </header>
        <div class="container card py-3 px-3">
            <div class="card-header text-center">
                <h2 class="h2">Output for {{ body['source'] }} &rarr; {{ body['target'] }}</h2>
                <p class="sm" id="wait">Please wait...</p>
            </div>
            
            <div class="card-body text-center">
                <div class="block justify-content-center" id="loader">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <h3 class="h3 container mt-4" id="logger">

                    </h3>
                </div>
                <h3 class="h3 alert alert-danger visually-hidden" role="alert" id="error">
                </h3>
                <div class="visually-hidden" id="results">
                    <div class="d-flex justify-content-center">
                        <ul class="list-group list-group-horizontal">
                            <li class="list-group-item" id="time"></li>
                            <li class="list-group-item" id="length"></li>
                            <li class="list-group-item" id="pc"></li>
                            <li class="list-group-item" id="ta"></li>
                        </ul>
                    </div>
                    <div class="d-flex justify-content-center mt-4">
                        <!-- <h3 class="h3">Path:</h3> -->
                        <div id="graph"></div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer text-center">
            <p class="text-muted">&copy; 2025. All rights reserved</p>
        </footer>
        <script src="static/js/script.js"></script>
        <script>
            let edgeId = 1;
            const nodes = new vis.DataSet([]);
            const edges = new vis.DataSet([]);

            const container = document.getElementById("graph");
            const data = {
                nodes: nodes,
                edges: edges
            };
            const loader = document.getElementById("loader");
            const results = document.getElementById("results");
            const error = document.getElementById("error");

            const options = {
                autoResize: true,
                height: '100%',
                width: '100%',
                nodes: {
                    color: {
                        border: "#000000",
                        background: "#ffffff",
                        highlight: {
                            border: "#000000",
                            background: "#ffffff"
                        }
                    },
                    font: {
                        size: 14
                    },
                    shape: "dot",
                    size: 20
                },
                edges: {
                    color: {
                        color: "#000000"
                    },
                    font: {
                        size: 10
                    }
                },
                physics: {
                    enabled: true,
                    stabilization: {
                        iterations: 100,
                        updateInterval: 25,
                        fit: true // fit the view to nodes after stabilizing
                    }
                }
            };

            const network = new vis.Network(container, data, options);
            network.once("stabilizationIterationsDone", function () {
                network.setOptions({
                    physics: { enabled: false },
                    interaction: { dragNodes: false }

                });

                  // Fix positions
                nodes.get().forEach(node => {
                    nodes.update({ id: node.id, fixed: { x: true, y: true } });
                });

                // Center the graph in the view
                network.fit({ animation: true });
                // network.fit({
                //     animation: {
                //         duration: 1000,
                //         easingFunction: "easeInOutQuad"
                //     }
                // });
            });

            function addNode(nodeId, label, pathLength) {
                try{
                    let nodeLabel = clearEntity(nodeId);
                    label = round(Number(label), 2)
                    // if(label == 0 || label == 1){
                    if(label == 0 || label == 1 || nodes.length == 0 || nodes.length == pathLength){
                        nodes.add({ id: nodeId, label: nodeLabel, color: {
                            border: "#ffffff",
                            background: "#000000",
                            font: {
                                bold: {
                                    mod: 'bold'
                                }
                            },
                            highlight: {
                                border: "#ffffff",
                                background: "#000000"
                            }
                        }});
                    } else {
                        nodes.add({ id: nodeId, label: `${nodeLabel}: ${label}` });
                    }
                } catch(err) {
                    console.log(err)
                }
            }

            function addEdge(label, from, to) {
                // if(label == "reached") return;
                label = clearEntity(label)
                edges.add({ id: edgeId, from: from, to: to, label: label });
                edgeId++;
            }

            const socket = io();
            socket.on('connect', () => {
                console.log('Connected to WebSocket');
            });

            // socket.on('response', function(text){
            //     console.log(text);
            // })

            function clearEntity(entity){
                return entity
                    .replace("http://dbpedia.org/", "")
                    .replace("http://www.wikidata.org/", "")
                    .replace("http://yago-knowledge.org/", "")
                    .replace("http://schema.org/", "")
                    .replace("ontology/", "")
                    .replace("resource/", "")
                    .replace("property/", "")
                    .replace("entity/", "")
            }

            function handleError(status, error_msg){
                loader.classList.add("visually-hidden");
                error.classList.remove("visually-hidden");
                document.getElementById("error").innerHTML = `<span class="fw-bold">Error ${status}:</span> ${error_msg}`
            }

            socket.on('response', function(data) {
                console.log(data);
                if(!JSON.stringify(data).startsWith("{")){
                    if(data.startsWith("Similarity between ")){
                        let data2 = data
                            .replace("Similarity between ", "")
                            .trim()
                            .split(":");
                        let entities = data2[0].split(" and ")
                        let similarity = round(Number(data2[1].trim()), 2);
                        document.getElementById("logger").innerHTML = `${entities[1].trim()}: ${similarity}`
                    } else {
                        document.getElementById("logger").innerText = data
                    }
                } else if("error" in data){
                    handleError(data['status'], data['error']);
                } else if(data['length']){
                    document.getElementById("wait").innerHTML = "";
                    loader.classList.add("visually-hidden");
                    results.classList.remove("visually-hidden")

                    document.getElementById("time").innerHTML = `<span class="fw-bold">Time:</span> ${data['time']} seconds`
                    document.getElementById("length").innerHTML = `<span class="fw-bold">Length:</span> ${data['length']}`
                    document.getElementById("pc").innerHTML = `<span class="fw-bold">PC:</span> ${data['PC']}`
                    document.getElementById("ta").innerHTML = `<span class="fw-bold">TA:</span> ${data['TA']}`

                    const paths = data["path"];
                    for(let path of paths){

                        let label1 = clearEntity(path[0][0]);
                        let label2 = clearEntity(path[2][0]);
                        let edgeLabel = clearEntity(path[1]);
                        if(edgeLabel == "reached") break;
                        addNode(label1, path[0][1], data["length"]);
                        addNode(label2, path[2][1], data["length"]);
                        addEdge(edgeLabel, label1, label2)
                    }
                } else {
                    handleError(504, "Timeout");
                }
            });

            document.addEventListener("DOMContentLoaded", (ev) => {
                let algorithm_body = document.getElementById("algorithm_body").value;
                algorithm_body = algorithm_body.replace("ImmutableMultiDict", "")
                    .replaceAll("(", "[")
                    .replaceAll(")", "]")
                    .replaceAll("'", "\"");
                algorithm_body = JSON.parse(algorithm_body)[0];
                console.log(algorithm_body);
                // console.log(algorithm_body[0]);
                // console.log(algorithm_body[5][0]);
                const accuracy = document.getElementById("accuracy");
                const timeout = document.getElementById("timeout");
                accuracy.innerHTML = `Accuracy: ${algorithm_body[5][1]||1}`
                if(algorithm_body[6][1]){
                    timeout.innerHTML = `Timeout in ${algorithm_body[6][1]} seconds`
                }
                else {
                    timeout.innerHTML = "No timeout"
                }
                socket.send(JSON.stringify(algorithm_body));
            })

        </script>
        <!-- <script src="static/js/script.js"></script> -->
        <!-- <script src="{{ url_for('static', filename='js/script.js') }}"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
